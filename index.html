<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#edf3e8" />
    <meta
      name="description"
      content="La Net. El teu dia, els teus apunts i la teva comunitat de batxillerat, en un sol lloc."
    />
    <title>La Net — El teu espai de batxillerat</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/lanet-mark.svg" />
    <style>
      #startup-card {
        box-sizing: border-box;
        max-width: 420px;
        margin: 18vh auto;
        padding: 28px;
        font:
          16px/1.6 system-ui,
          -apple-system,
          sans-serif;
        color: #3c3430;
        background: #fffdfa;
        border: 1px solid #ece5de;
        border-radius: 20px;
      }
      #startup-card img {
        width: 48px;
        height: 48px;
      }
      #startup-card h1 {
        font-size: 24px;
        margin: 16px 0 8px;
      }
      #startup-card p {
        color: #786f68;
        margin: 0;
      }
      #startup-retry {
        display: inline-block;
        margin-top: 20px;
        padding: 11px 18px;
        border: 1px solid #e7b793;
        border-radius: 12px;
        background: #ffdfc4;
        color: #593b27;
        text-decoration: none;
      }
      #startup-retry[hidden] {
        display: none;
      }
      @media (max-width: 460px) {
        #startup-card {
          margin: 16vh 16px;
          padding: 24px;
        }
      }
    </style>
    <script defer src="/startup.js"></script>
  </head>
  <body>
    <noscript
      >Activa JavaScript al navegador per obrir La Net i iniciar sessió amb Google.</noscript
    >
    <div id="root">
      <main id="startup-card" aria-busy="true">
        <img src="/lanet-mark.svg" alt="La Net" width="48" height="48" />
        <h1 id="startup-title">Obrint La Net</h1>
        <p id="startup-message" role="status">Preparant el teu espai…</p>
        <a id="startup-retry" href="/" hidden>Tornar-ho a provar</a>
      </main>
    </div>
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
