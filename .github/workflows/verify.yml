name: Verify La Net
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run audit:source
      - run: npm run typecheck
      - run: npm test
      - run: npm run pages:build
      - name: Install Linux media codecs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio
      - name: Start Linux audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=lanet_ci
          pactl set-default-sink lanet_ci
          pactl info
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Firefox audio smoke check
        run: npm run test:browser
        env:
          LANET_BROWSER_ENGINES: firefox
          LANET_BROWSER_CHECK: Compatible audio
      - run: npm run test:roulette-animation
      - run: npm run test:roulette-board
      - run: npm run test:secret-room
      - run: npm run test:mobile-navigation
      - run: npm run test:responsive
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: local-browser-evidence
          retention-days: 7
          path: |
            output/roulette-animation/
            output/roulette-board/browser/
            output/secret-room/
            output/mobile-navigation/
            output/responsive/
            output/security-compat/

