name: Verify La Net
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run audit:source
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/generate-official-schedule.mjs --check
      - run: npm run pages:build
      - run: npm run test:official-schedule-api
  browsers:
    name: Browser checks (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: contents
            tests: |
              npm run test:subject-workspaces
              npm run test:contents
              npm run test:fast-uploads
          - group: navigation
            tests: |
              npm run test:onboarding
              npm run test:official-schedule
              npm run test:schedule-cards
              npm run test:workspace-recovery
              npm run test:mobile-navigation
          - group: school
            tests: |
              npm run test:delegate-agenda
              npm run test:activity-dashboard
              npm run test:focus-mode
              npm run test:pau-history
              npm run test:pau
              npm run test:pau-top5
          - group: academics
            tests: |
              npm run test:student-guide
              npm run test:course-grades
              npm run test:reactions
          - group: board
            tests: |
              npm run test:predictions
              npm run test:abuse
              npm run test:roulette-board
          - group: casino
            tests: |
              npm run test:roulette-animation
              npm run test:secret-room
              npm run test:roulette-panorama
          - group: audio
            tests: |
              npm run test:preferences
              npm run test:roulette-sound
          - group: compatibility
            tests: |
              npm run test:responsive
              npm run test:browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run pages:build
      - name: Install Linux media codecs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio
      - name: Start Linux audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=lanet_ci
          pactl set-default-sink lanet_ci
          pactl info
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Firefox audio smoke check
        if: matrix.group == 'compatibility'
        run: npm run test:browser
        env:
          LANET_BROWSER_ENGINES: firefox
          LANET_BROWSER_CHECK: Compatible audio
      - name: Run browser regressions
        run: ${{ matrix.tests }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: local-browser-evidence-${{ matrix.group }}
          retention-days: 7
          path: |
            output/onboarding/browser/
            output/delegates/browser/
            output/activity-dashboard/browser/
            output/focus/browser/
            output/pau-history/browser/
            output/pau/
            output/pau-top5/
            output/subject-workspaces/browser/
            output/contents/
            output/fast-uploads/
            output/course-grades/
            output/student-guide/browser/
            output/reactions/browser/
            output/official-schedule/browser/
            output/schedule-cards/browser/
            output/workspace-recovery/
            output/predictions/
            output/abuse/browser/
            output/roulette-animation/
            output/roulette-board/browser/
            output/roulette-panorama/
            output/roulette-sound/
            output/preferences/browser/
            output/secret-room/
            output/mobile-navigation/
            output/responsive/
            output/security-compat/
  validate:
    name: Validate
    if: always()
    needs: [core, browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$BROWSER_RESULT" = success
